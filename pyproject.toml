[project]
name = "neurospatial"
version = "0.1.0"
description = "Spatial cell-cell communication analysis of the V1/V2 boundary in developing human cortex"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Enough to run the unit test suite in a clean env (CI). The stage runtimes'
# full deps are managed by the per-env conda specs in envs/, not here.
dev = ["pytest>=7", "numpy", "pandas"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurospatial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
