[project]
name = "neurospatial"
version = "0.1.0"
description = "Spatial cell-cell communication analysis of the V1/V2 boundary in developing human cortex"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
